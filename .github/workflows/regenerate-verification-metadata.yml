name: Regenerate Dependency Verification Metadata

# Manual, human-triggered only - never on push/pull_request. Regenerating
# gradle/verification-metadata.xml means running Gradle against whatever build files are on the
# target branch, which for a Dependabot branch means Dependabot's own version bump. Doing that
# automatically from a PR-triggered workflow (e.g. pull_request_target) would mean executing
# PR-controlled build files under a token with write access - the exact "pwn request" pattern
# GitHub's default read-only GITHUB_TOKEN for Dependabot-triggered workflows exists to prevent.
# workflow_dispatch requires the invoker to already have write access to this repo - the same
# trust level they'd need to run this locally themselves, just without the local clone/push
# round-trip.
#
# Covers the root module + allcrud-generator-gradle-plugin (one Gradle multi-project build, one
# verification-metadata.xml) - allcrud-generator-maven-plugin is a separate Maven build and
# doesn't use Gradle's dependency verification at all.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to regenerate gradle/verification-metadata.xml on (e.g. a Dependabot PR branch)'
        required: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # Also runs the full build (not just dependency resolution) - confirms the bumped
      # dependency actually works before committing new checksums for it, not just that it
      # downloads.
      - name: Regenerate verification metadata
        run: ./gradlew --write-verification-metadata sha256 build

      # inputs.branch is user-controlled (whoever triggers this workflow) - templated directly
      # into the run block below, it would be shell-injectable (e.g. a branch name containing
      # `; rm -rf .` or command substitution). Passed through an env var instead so the shell
      # only ever sees it as a plain string value, never as script it could parse.
      #
      # Commits via the GitHub Contents API instead of a plain git push - a plain-pushed commit
      # is never signed (no local GPG key on the runner), and every branch this can target
      # (main/staging/develop) requires signed commits. The ruleset checks every commit in the
      # push that isn't already reachable from another branch, so it blocks the eventual merge
      # even though a squash would synthesize a fresh commit - confirmed against GitHub's own
      # docs on the required_signatures rule. The Contents API constructs the commit server-side
      # with no custom author/committer/signature data, which GitHub signs itself (web-flow key) -
      # same mechanism already confirmed for PR merge commits.
      - name: Commit via Contents API (auto-signed by GitHub)
        env:
          BRANCH: ${{ inputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FILE: gradle/verification-metadata.xml
        run: |
          set -euo pipefail
          if git diff --quiet -- "$FILE"; then
            echo "No changes to $FILE - nothing to commit."
            exit 0
          fi

          # The regenerated content above was built from the tree as of checkout - but the sha
          # this PUT needs is fetched fresh, right now, right before writing. If the branch moved
          # in between (another run, or any other push landing on it), that fresh sha still
          # matches the *current* remote state, so the PUT would succeed - and silently overwrite
          # whatever landed in between with output regenerated from the now-stale checkout,
          # with no error at all. Guarded by comparing the checked-out blob for this file
          # (git's own tracking of what was actually built against) with the current remote blob
          # right before writing - abort instead of overwriting if they don't match; the checked
          # -out sha is also what's sent as the PUT's sha, not the freshly-fetched one, since by
          # this point they're confirmed identical.
          checkout_sha=$(git rev-parse "HEAD:$FILE")
          current_sha=$(gh api "repos/$REPO/contents/$FILE?ref=$BRANCH" -q '.sha')
          if [ "$current_sha" != "$checkout_sha" ]; then
            echo "::error title=Stale checkout, aborting::$FILE on $BRANCH changed since this workflow checked it out (checkout blob $checkout_sha, current remote blob $current_sha) - another push landed on $BRANCH while this run was building. Not overwriting it. Re-run this workflow against $BRANCH's current state instead."
            exit 1
          fi

          # content is base64 of a multi-KB XML file - too large for the OS's argument-length
          # limit, whether passed as a -f/-F CLI value or as a jq --arg (a $(...) substitution
          # used as a command argument still goes through argv, same limit either way). Written
          # to a file and loaded with --rawfile instead, which jq reads directly, never touching
          # argv. The payload itself is then sent via --input, streaming the body instead of
          # building it from CLI flags.
          base64 -w0 "$FILE" > /tmp/content.b64
          jq -n --rawfile content /tmp/content.b64 \
            --arg message "chore: regenerate gradle/verification-metadata.xml" \
            --arg sha "$checkout_sha" \
            --arg branch "$BRANCH" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}' > /tmp/contents-payload.json

          gh api "repos/$REPO/contents/$FILE" -X PUT --input /tmp/contents-payload.json -q '.commit.sha'
