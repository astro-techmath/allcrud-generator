name: Release

# release: published is the same trigger already validated in allcrud's real v0.2.1 publish. workflow_dispatch
# stays available too (regenerate-verification-metadata.yml, ci.yml) for manual/exceptional runs unrelated to
# this workflow - this one is release-triggered only, nothing here needs a manual escape hatch of its own.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # server-*-env-var / gpg-passphrase-env-var are the NAMES of the env vars settings.xml / gpg
      # should read at deploy time (not the values themselves). Confirmed against setup-java v6.1.0's
      # real action.yml: those are the primary input names; the old server-username / server-password /
      # gpg-passphrase names remain only as deprecated aliases. gpg-private-key imports the same
      # SIGNING_KEY secret already used on the Gradle side into an isolated keyring automatically -
      # maven-gpg-plugin has no in-memory-key mode like vanniktech, it needs a real keyring on disk.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase-env-var: SIGNING_KEY_PASSPHRASE

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # Full test gate for BOTH mechanisms before anything is published - if either fails, nothing
      # below runs. ./gradlew build already covers the root project and the gradle-plugin subproject
      # together (confirmed empirically - a plain `build` at the root cascades to subprojects, no
      # extra flags needed). The Maven module resolves the root artifact via mavenLocal(), which
      # ./gradlew build alone never populates - publishToMavenLocal has to run first or mvn verify
      # fails to resolve its own dependency on a clean runner (caught by CodeRabbit, confirmed real:
      # this is the same gap a locally-empty-but-not-actually-clean .m2 masked during earlier manual
      # testing this session). Split into 2 steps so the Maven step can set SIGNING_KEY_PASSPHRASE -
      # gpg-passphrase-env-var above only names that env var, it doesn't provide the value, and the
      # sign goal bound to the verify phase needs it to unlock the imported key.
      - name: Build and test Gradle projects - publish gate
        run: |
          ./gradlew build
          ./gradlew publishToMavenLocal

      # gpg.skip defaults to true in the pom (see the property's own comment there) so that CI's
      # regular, non-release `mvn verify` never needs a key - this is the one place that default
      # is deliberately overridden, since the whole point of this gate is confirming real signing
      # works before the actual deploy below.
      - name: Build, test, and sign Maven plugin - publish gate
        env:
          SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: |
          mvn -f allcrud-generator-maven-plugin/pom.xml verify -Dgpg.skip=false

      - name: Publish Gradle artifacts (root + gradle-plugin) to Maven Central
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      # deploy re-runs test/verify/sign as part of Maven's own lifecycle (validate -> ... -> verify ->
      # install -> deploy always executes prior phases first) - a bit redundant with the gate step
      # above, but that's Maven's normal behavior, not a workaround, and it means this step alone is
      # self-contained proof the exact bits being uploaded were freshly tested and signed.
      # autoPublish=true in the plugin's own pom.xml config releases automatically once Central's
      # validation passes, matching publishAndReleaseToMavenCentral's behavior on the Gradle side.
      - name: Publish Maven plugin to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: mvn -f allcrud-generator-maven-plugin/pom.xml deploy -Dgpg.skip=false
