name: Release

# release: published is the same trigger already validated in allcrud's real v0.2.1 publish. workflow_dispatch
# stays available too (regenerate-verification-metadata.yml, ci.yml) for manual/exceptional runs unrelated to
# this workflow - this one is release-triggered only, nothing here needs a manual escape hatch of its own.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Test gate for BOTH mechanisms, with no real signing key or Central credentials in this job's
  # environment at all - CodeRabbit's finding: the original single-job workflow loaded the real
  # SIGNING_KEY into setup-java's isolated keyring before running the test gate, meaning a compromised
  # or malicious step in the "just testing" phase could exfiltrate the real production key. Splitting
  # into 2 jobs keeps the key out of this job's reach entirely - it only exists in the publish job below.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # ./gradlew build already covers the root project and the gradle-plugin subproject together
      # (confirmed empirically - a plain `build` at the root cascades to subprojects, no extra flags
      # needed). The Maven module resolves the root artifact via mavenLocal(), which ./gradlew build
      # alone never populates - publishToMavenLocal has to run first or mvn verify fails to resolve
      # its own dependency on a clean runner.
      - name: Build and test Gradle projects
        run: |
          ./gradlew build
          ./gradlew publishToMavenLocal

      # No key present in this job, so gpg.skip stays at its pom default (true) - this only proves
      # the Maven module compiles and its own tests pass, not that signing works. Real signing is
      # only ever exercised in the publish job below, with the real key, right before the real deploy.
      - name: Build and test Maven plugin
        run: mvn -f allcrud-generator-maven-plugin/pom.xml verify

  # Only this job ever sees the real SIGNING_KEY / MAVEN_CENTRAL_* secrets, and only after the verify
  # job above has passed (needs:). Rebuilds from scratch since GitHub Actions jobs don't share a
  # filesystem across runners - there's no artifact to carry over from verify, and Maven's own deploy
  # lifecycle re-runs verify anyway (validate -> ... -> verify -> install -> deploy), so this isn't
  # extra redundant work beyond what deploy already does by itself.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # server-username/server-password are the NAMES of the env vars settings.xml should read at
      # deploy time (not the values themselves) - confirmed against setup-java's own action.yml, not
      # the generic docs (which conflated this action's v4 with newer major versions using different
      # input names). gpg-private-key imports the same SIGNING_KEY secret already used on the Gradle
      # side into an isolated keyring automatically - maven-gpg-plugin has no in-memory-key mode like
      # vanniktech, it needs a real keyring on disk, which is exactly what this sets up.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase: SIGNING_KEY_PASSPHRASE

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      # publishAndReleaseToMavenCentral depends on the project's own build/test tasks via Gradle's task
      # graph, but the Maven module below still resolves the root artifact via mavenLocal() - that
      # never gets populated by publishAndReleaseToMavenCentral itself, so publishToMavenLocal has to
      # run first, same reason as in the verify job.
      - name: Publish Gradle artifacts (root + gradle-plugin) to Maven Central
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          ./gradlew publishToMavenLocal
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      # deploy re-runs test/verify/sign as part of Maven's own lifecycle (validate -> ... -> verify ->
      # install -> deploy always executes prior phases first), so this step alone is self-contained
      # proof the exact bits being uploaded were freshly tested and signed. autoPublish=true in the
      # plugin's own pom.xml config releases automatically once Central's validation passes, matching
      # publishAndReleaseToMavenCentral's behavior on the Gradle side. The enforcer guard bound to the
      # deploy phase (see pom.xml) fails fast if gpg.skip isn't explicitly flipped to false here.
      - name: Publish Maven plugin to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: mvn -f allcrud-generator-maven-plugin/pom.xml deploy -Dgpg.skip=false
