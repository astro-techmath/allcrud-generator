name: Notify Bugfix Propagation

# A bugfix/* PR merges straight into the release/* branch it was cut from. Nothing here checks
# whether the same fix also lands on next - if it doesn't, the fix is silently missing from
# next and could resurface in a future release cut from it. This workflow doesn't propagate
# anything automatically (that stays a manual step, done however fits the situation) - it just
# makes sure the reminder can't be missed, by posting on the PR and in the run's job summary.
on:
  pull_request:
    branches: ['release/**']
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # Intentionally false, not the default: cancelling a run mid-sequence between reading
  # the marker comment and creating/updating it could leave the comment half-written.
  # Serializing (not interrupting) same-PR reruns keeps that sequence atomic.
  cancel-in-progress: false

jobs:
  notify:
    name: Post propagation reminder
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.base.ref, 'release/') && startsWith(github.event.pull_request.head.ref, 'bugfix/')
    runs-on: ubuntu-latest
    # contents: read is not needed here (no repository content is read, only PR/issue
    # metadata via the API); pull-requests: write is for posting/updating the comment.
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Post propagation reminder
        run: |
          set -euo pipefail
          MARKER="<!-- bugfix-propagation-reminder -->"
          MESSAGE=$(cat <<EOF
          $MARKER
          ⚠️ **Bugfix propagation reminder**

          This bugfix was merged into \`$BASE_REF\`. Please make sure this change also
          reaches \`next\` - without it, the fix may be missing from \`next\` and could
          resurface in a future release.

          If it hasn't been propagated yet, please do so before considering this
          fix fully applied.
          EOF
          )

          # Summary written first so it lands even if the comment step below fails
          # (e.g. transient API error) - the reminder should never silently disappear.
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"

          # Idempotent: reruns of this job (e.g. a manual re-run) update the existing
          # reminder instead of piling up duplicate comments on the same PR.
          #
          # --paginate + -q/--jq would apply the jq filter to each page separately (not to
          # the combined result), so a marker comment sitting on a later page could be missed -
          # documented gh CLI behavior, not a bug. --slurp collects all pages into one array
          # first; gh api rejects --slurp combined with -q/--jq, so the filter runs afterward,
          # piped to a separate jq. Also checks the comment author is github-actions[bot], not
          # just any comment that happens to contain the marker text.
          existing_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --slurp \
            | jq -r --arg marker "$MARKER" \
              'add | map(select(.user.login == "github-actions[bot]" and (.body | contains($marker))))[0].id // empty')

          if [ -n "$existing_id" ]; then
            gh api "repos/$REPO/issues/comments/$existing_id" -X PATCH -f body="$MESSAGE" > /dev/null
          else
            echo "$MESSAGE" | gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file -
          fi
