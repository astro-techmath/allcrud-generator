name: CI

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarQube needs full history (blame/authorship) for its analysis - a shallow
          # clone (Actions' default) breaks that.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Multi-project build (see settings.gradle.kts) - covers the root module and
      # allcrud-generator-gradle-plugin in one pass.
      - name: Build and test
        run: ./gradlew build

      - name: SonarQube analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # allcrud-generator-maven-plugin is a separate, independent Maven build (own pom.xml,
      # not part of the Gradle multi-project) - see its pom.xml for why. No SonarQube here yet -
      # that's a separate follow-up once the Maven-side toolchain is sorted out.
      - name: Build and test
        working-directory: allcrud-generator-maven-plugin
        run: mvn -B verify
