name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce — include a relevant snippet of your OpenAPI spec and/or allcrud-generator.yml if the issue is about generation output.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: generator-version
    attributes:
      label: allcrud-generator version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: core-version
    attributes:
      label: Pinned allcrud core version (allcrudCoreVersion in gradle.properties)
      placeholder: "0.2.0"
    validations:
      required: true

  - type: dropdown
    id: build-tool
    attributes:
      label: Build tool
      options:
        - Gradle
        - Maven
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      description: Optional. Paste any relevant output — this will be formatted as code automatically.
      render: shell
