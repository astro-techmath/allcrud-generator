openapi: 3.0.3
info:
  title: Auto Resource Request-Body-Match API
  version: 1.0.0
x-allcrud-auto-resource: true
paths:
  /sprockets:
    get:
      operationId: findAllSprockets
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sprocket'
  /sprockets/{id}:
    put:
      operationId: updateSprocket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Sprocket'
      responses:
        '204':
          description: Updated - deliberately no response body referencing Sprocket, so
            the ONLY signal linking this item path to the collection is the PUT's own
            requestBody schema, not a response schema (see referencesSchema's requestBody
            branch, AllcrudSpringCodegen).
components:
  schemas:
    Sprocket:
      type: object
      properties:
        id: { type: integer, format: int64, readOnly: true }
        name: { type: string }
