# TEST FIXTURE - exercises AllcrudGeneratorYamlConfig against product-example.yaml's two
# resources (Product, Order). Order intentionally disables converter/service/controller
# (CONTROLLER always needs SERVICE+CONVERTER+POJO and SERVICE always needs REPOSITORY, see
# AllcrudGeneratorYamlConfig#validateLayerDependencies, so pojo+repository is the reduced set
# that's still valid) and Product overrides just the pojo overwrite policy - see
# AllcrudGeneratorYamlConfigCompatTest for what each override is expected to produce.
pojoNamingStyle: VO
generation:
  pojo:
    package: org.openapitools.model
    onRegenerate: preserve
  repository:
    package: org.openapitools.api
  converter:
    package: org.openapitools.api
  service:
    package: org.openapitools.api
  controller:
    package: org.openapitools.api
resources:
  Order:
    converter:
      enabled: false
    service:
      enabled: false
    controller:
      enabled: false
  Product:
    pojo:
      onRegenerate: overwrite
