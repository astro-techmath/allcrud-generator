# TEST FIXTURE - exercises AllcrudGeneratorYamlConfig against product-example.yaml's two
# resources (Product, Order) through the real plugin task, not just AllcrudGenerator directly.
# Order intentionally disables pojo/converter/controller (CONTROLLER always needs
# SERVICE+CONVERTER+POJO and SERVICE always needs REPOSITORY, see
# AllcrudGeneratorYamlConfig#validateLayerDependencies, so repository+service is the smallest
# reduced set that's still valid) - proves the per-resource layer overrides reach all the way
# through the Gradle task, including a real compileJava (see
# generatedSourcesAreWiredIntoCompileJavaAndCompile).
pojoNamingStyle: VO
generation:
  pojo:
    package: org.openapitools.model
    onRegenerate: preserve
  repository:
    package: org.openapitools.api
  converter:
    package: org.openapitools.api
  service:
    package: org.openapitools.api
  controller:
    package: org.openapitools.api
resources:
  Order:
    pojo:
      enabled: false
    converter:
      enabled: false
    controller:
      enabled: false
