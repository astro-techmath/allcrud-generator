# TEST FIXTURE - exercises AllcrudGeneratorYamlConfig against product-example.yaml's two
# resources (Product, Order) through the real plugin task, not just AllcrudGenerator directly.
# Order intentionally generates a reduced layer set (repository + service only - CONTROLLER
# always needs SERVICE+CONVERTER and SERVICE always needs REPOSITORY, see
# AllcrudGeneratorYamlConfig#validateLayerDependencies, so this is the smallest reduced set
# that's still valid without pulling in POJO or CONTROLLER) - proves the per-resource
# "generate" override reaches all the way through the Gradle task, including a real
# compileJava (see generatedSourcesAreWiredIntoCompileJavaAndCompile).
pojoNamingStyle: VO
packages:
  pojo: org.openapitools.model
  repository: org.openapitools.api
  converter: org.openapitools.api
  service: org.openapitools.api
  controller: org.openapitools.api
defaults:
  generate: [pojo, repository, converter, service, controller]
  pojo:
    onRegenerate: preserve
resources:
  Order:
    generate: [repository, service]
